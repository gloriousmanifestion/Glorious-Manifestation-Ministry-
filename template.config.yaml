# Template configuration for repos created from this template.
# Copy to template.config.yaml and fill in your values, then run:
#   pnpm run apply-template
#
# All values here are used to replace placeholders across the repo (name, SEO,
# deployment paths, systemd service names, docs, etc.).
#
# Monorepo apps (Solo structure):
#   - apps/frontend  (package: website) — PGM Pastoral School frontend
#   - apps/backend   (package: backend)  — Rust API server
#   - apps/docs      (package: docs)     — Docusaurus documentation

app:
  # Display name of your platform or application (used in titles, headers, footer).
  name: Prophetic Glorious Manifestation
  # Short name for nav bar / compact UI (defaults to app.name if omitted).
  nameShort: PGMM | Pastoral School
  # One-line description of what the app does (SEO + marketing).
  description: Pastoral School for pastors, ministers and prophets. Owerri, Imo State.
  # Slug for package names and URLs (lowercase, hyphens). Defaults to name lowercased and hyphenated.
  nameSlug: pgm

seo:
  title: Prophetic Glorious Manifestation — Pastoral School
  description: Pastoral School under Prophetic Glorious Manifestation. Training pastors, ministers and prophets in Owerri, Imo State. February to July program, Monday to Friday.
  keywords: Prophetic Glorious Manifestation, Pastoral School, Owerri, Imo State, church ministry, pastors, ministers, prophets, ministry training, biblical studies, prophetic ministry
  # Paths relative to frontend static assets (e.g. /logo.svg, /favicon.ico).
  favicon: /favicon.ico
  ogImage: /og-image.png

branding:
  # Logo path for frontend (e.g. /logo.svg). Also used in docs if same.
  logoPath: /favicon.png
  # Alt text for the logo.
  logoAlt: Prophetic Glorious Manifestation — Pastoral School

repo:
  # GitHub org and repo name (for "View on GitHub" and doc edit URLs).
  organization: 1ngaOS
  name: pgm

# Deployment and systemd (VM paths and service names).
deployment:
  # Value for /opt/<appName>/... and VM_APP_NAME secret. Use a short slug (e.g. app, myapp).
  appName: pgm
  # Systemd unit names (used in CI/CD and example unit files).
  backendStagingService: pgm-backend-staging
  backendProductionService: pgm-backend-production
  frontendStagingService: pgm-frontend-staging
  frontendProductionService: pgm-frontend-production
  # Systemd service file paths (relative to infra/systemd/).
  # These files are copied during deploy and referenced in workflow triggers.
  # Defaults to {appNameSlug}-{component}-{env}.service if not specified.
  frontendStagingServiceFile: pgm-frontend-staging.service
  frontendProductionServiceFile: pgm-frontend-production.service
  backendStagingServiceFile: pgm-backend-staging.service
  backendProductionServiceFile: pgm-backend-production.service
  # Frontend ports (for staging and production environments).
  frontendStagingPort: 6200
  frontendProductionPort: 6400
  # Backend API ports (for frontend to connect to).
  backendStagingPort: 6100
  backendProductionPort: 6300
  # Database names (for PostgreSQL).
  databaseName: pgm_db
  databaseTestName: pgm_db_test

# Optional: public URLs (for docs and app links in configs).
urls:
  app: https://propheticgloriousmanifestation.org
  docs: https://docs.propheticgloriousmanifestation.org

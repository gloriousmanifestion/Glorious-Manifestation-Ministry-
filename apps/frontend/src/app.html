<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			(function () {
				var t = localStorage.getItem('pms_theme');
 				var dark =
					t === 'light'
						? false
						: t === 'dark'
							? true
							: t === 'system'
								? window.matchMedia('(prefers-color-scheme: dark)').matches
								: true;
				if (dark) document.documentElement.classList.add('dark');
			})();
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
		<meta name="theme-color" content="#374266" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="Prophetic Glorious Manifestation — Pastoral School for pastors, ministers and prophets. Owerri, Imo State."
		/>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-[#FFFCFA] text-slate-900 antialiased dark:bg-[#374266] dark:text-white transition-colors duration-200"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

version: '3.8'

# Run from repo root: docker compose -f infra/compose.yml up --build

services:
  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - RUST_LOG=debug
      # Set DATABASE_URL for a persistent DB (default: SQLite in /app/data/pms.db inside container)
      # - DATABASE_URL=sqlite:///app/data/pms.db
    # No volume over /app so the built binary runs. For dev with live reload, run the backend locally.
    networks:
      - pgm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  pgm-network:
    driver: bridge

